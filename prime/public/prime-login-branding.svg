<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title">
  <title id="title">PRIME</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffad24" />
      <stop offset="0.52" stop-color="#ff9900" />
      <stop offset="1" stop-color="#ee7900" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4dc" stop-opacity=".24" />
      <stop offset="1" stop-color="#fff4dc" stop-opacity=".08" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#8b5a00" flood-opacity=".22" />
    </filter>
    <style>
      .rings { transform-box: fill-box; transform-origin: center; animation: float 12s ease-in-out infinite alternate; }
      .wordmark { transform-box: fill-box; transform-origin: center; animation: settle 5s ease-in-out infinite; }
      @keyframes float { from { transform: translate(-18px, 10px) rotate(-3deg); } to { transform: translate(12px, -16px) rotate(3deg); } }
      @keyframes settle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .rings, .wordmark { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="1200" fill="url(#background)" />
  <g class="rings" fill="none" stroke="url(#ring)">
    <circle cx="790" cy="760" r="420" stroke-width="72" />
    <circle cx="790" cy="760" r="305" stroke-width="50" />
    <path d="M1045 1045 1190 1190" stroke-width="78" stroke-linecap="round" />
  </g>
  <circle cx="790" cy="760" r="205" fill="#e67c00" opacity=".16" />
  <g class="wordmark" filter="url(#shadow)">
    <text x="112" y="330" fill="#fffdf4" stroke="#9a4c00" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="156" letter-spacing="-4">PRIME</text>
  </g>
  <text x="116" y="465" fill="#fffaf0" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="400" letter-spacing=".3">
    <tspan x="116" dy="0">Simplified point of sale</tspan>
    <tspan x="116" dy="62">for your business</tspan>
  </text>
</svg>
